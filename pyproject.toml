# إعدادات جودة الكود؛ المشروع تطبيق سطح مكتب يُشغّل عبر app.py
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["backups", "build", "dist", "tests/artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# بعض اختباراتنا تهيئ مجلد البيانات وQt قبل استيراد وحدات التطبيق.
"tests/*.py" = ["E402"]
