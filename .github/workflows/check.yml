name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_exe:
        description: Build, test and publish the Windows EXE only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ar
            scale: "1"
          - language: en
            scale: "1.5"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app.py src tests scripts
      - run: python -m ruff format --check app.py src tests scripts
      - run: python scripts/run_tests.py --language ${{ matrix.language }} --scale ${{ matrix.scale }}

  # لا يُنشر التطبيق إلا بعد نجاح مصفوفة الاختبارات، وعلى الفرع الرئيسي بطلب صريح.
  release_exe:
    needs: verify
    if: >-
      github.repository == 'MeshalAlfaifi0/IT-Support-Toolkit-Pro' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_exe) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-exe]')))
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: windows-exe-release
      cancel-in-progress: false
    env:
      IT_TOOLKIT_BUILD_NAME: IT-Operations-Console-Windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify source startup and saved settings
        run: python scripts/smoke_test.py --report artifacts/source-startup.json
      - name: Build the Windows executable
        shell: cmd
        run: scripts\build_exe.bat
      - name: Verify executable startup and saved settings
        run: python scripts/smoke_test.py --exe dist/IT-Operations-Console-Windows.exe --report artifacts/exe-startup.json
      - name: Publish the verified executable only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/IT-Operations-Console-Windows.exe'
          $tag = "windows-$($env:GITHUB_RUN_NUMBER)"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            'IT Operations Console for Windows (64-bit).',
            '',
            'Built from source and tested on Windows: Arabic and English test suites, lint, formatting, source startup and executable startup.',
            'The executable was started twice using isolated temporary data to verify saved language and theme settings.',
            '',
            "Source commit: $($env:GITHUB_SHA)",
            "SHA256: $hash",
            '',
            'Download IT-Operations-Console-Windows.exe and open it directly. Python is not required.',
            'The EXE is the only uploaded release asset. Personal databases, application logs, historical backups and virtual environments are kept private.',
            'Interface startup was checked with Qt offscreen mode; this does not replace a visible UI inspection on your own display.',
            'No project license has been selected.'
          )
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release create $tag $exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'IT Operations Console - Windows' --notes-file $notesPath --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
          $releaseJson = gh api "repos/$($env:GITHUB_REPOSITORY)/releases"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release assets.' }
          $release = @($releaseJson | ConvertFrom-Json | Where-Object { $_.tag_name -eq $tag })
          if ($release.Count -ne 1) { throw 'Could not find the uploaded draft release.' }
          $release = $release[0]
          $assets = @($release.assets)
          if ($assets.Count -ne 1 -or $assets[0].name -ne 'IT-Operations-Console-Windows.exe' -or $assets[0].size -ne (Get-Item -LiteralPath $exe).Length -or $assets[0].state -ne 'uploaded') {
            throw 'Release must contain exactly the verified EXE.'
          }
          if ($assets[0].digest -and $assets[0].digest -ne "sha256:$hash") { throw 'Uploaded EXE checksum mismatch.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
          "Published EXE: $($release.html_url)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "SHA256: $hash" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
