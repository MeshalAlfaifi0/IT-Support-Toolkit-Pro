name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ar
            scale: "1"
          - language: en
            scale: "1.5"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app.py src tests scripts
      - run: python -m ruff format --check app.py src tests scripts
      - run: python scripts/run_tests.py --language ${{ matrix.language }} --scale ${{ matrix.scale }}
